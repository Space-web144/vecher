<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вечер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&family=Spectral:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1A29;
    --panel:#252339;
    --panel-hover:#2E2B47;
    --ink:#F0ECF4;
    --muted:#A8A2BC;
    --line:#3A3652;
    --gold:#C9A961;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Onest",system-ui,-apple-system,sans-serif;
    font-size:17px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:40px 20px 56px;
  }
  main{width:100%;max-width:480px}

  .intro{margin:0 0 34px}
  .intro p{
    font-family:"Spectral",Georgia,serif;
    font-size:clamp(20px,5.4vw,24px);
    line-height:1.4;
    margin:0 0 6px;
  }
  .intro p:last-child{margin-bottom:0}
  .intro p.dim{color:var(--muted);font-size:clamp(17px,4.4vw,19px)}

  .question{
    font-family:"Spectral",Georgia,serif;
    font-size:clamp(21px,5.6vw,25px);
    font-weight:500;
    line-height:1.35;
    margin:0 0 20px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }

  .options{display:grid;gap:9px}
  .option{
    width:100%;
    display:block;
    text-align:left;
    font:inherit;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:15px 17px;
    cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .option:hover{background:var(--panel-hover);border-color:var(--gold)}
  .option:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  .message p{
    font-family:"Spectral",Georgia,serif;
    font-size:clamp(20px,5.4vw,24px);
    line-height:1.45;
    margin:0 0 8px;
  }
  .message p:first-child{color:var(--gold)}

  .ask-time{
    margin-top:30px;
    padding-top:22px;
    border-top:1px solid var(--line);
  }
  label{display:block;color:var(--muted);font-size:16px;margin-bottom:10px}
  input[type=text]{
    width:100%;
    font:inherit;
    font-size:18px;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
  }
  input[type=text]:focus{outline:2px solid var(--gold);outline-offset:2px;border-color:var(--gold)}
  input[type=text]::placeholder{color:#6F6889}

  .send{
    margin-top:12px;
    width:100%;
    font:inherit;
    font-size:17px;
    font-weight:500;
    color:#1B1A29;
    background:var(--gold);
    border:none;
    border-radius:12px;
    padding:15px 18px;
    cursor:pointer;
  }
  .send:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>

  <!-- ШАГ 1 — вопрос -->
  <div id="step1">
    <div class="intro">
      <p>Рад, что ты решила продолжить.</p>
      <p class="dim">Первый вопрос очень простой.</p>
    </div>
    <h1 class="question">Как бы ты хотела провести завтрашний вечер?</h1>
    <div class="options">
      <button class="option" type="button" data-value="Уютно">Уютно</button>
      <button class="option" type="button" data-value="Отвлечённо">Отвлечённо</button>
      <button class="option" type="button" data-value="Мило">Мило</button>
    </div>
  </div>

  <!-- ШАГ 2 — сообщение и время -->
  <div id="step2" class="hidden">
    <div class="message">
      <p>Выбор принят.</p>
      <p>Хороший выбор.</p>
      <p>Завтра просто будь дома в удобное для тебя время.</p>
      <p>Остальное я возьму на себя.</p>
    </div>

    <!-- ПОЧТА: адрес в action -->
    <form method="POST" action="https://formsubmit.co/L2345678999@yandex.ru" class="ask-time">
      <input type="hidden" name="_subject" value="Ответ со страницы">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" id="next" value="">
      <input type="text" name="_honey" class="hidden">
      <input type="hidden" name="Выбор" id="choice" value="">

      <label for="time">Во сколько тебе будет удобно?</label>
      <input type="text" id="time" name="Время" placeholder="Например, 19:30" required autocomplete="off">
      <button class="send" type="submit">Отправить</button>
    </form>
  </div>

  <!-- ШАГ 3 — после отправки -->
  <div id="step3" class="message hidden">
    <p>Записал.</p>
    <p>До завтра.</p>
  </div>

</main>

<script>
  document.getElementById("next").value = location.origin + location.pathname + "?ok=1";

  document.querySelectorAll(".option").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.getElementById("choice").value = btn.dataset.value;
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
      window.scrollTo(0, 0);
    });
  });

  if (location.search.indexOf("ok=1") !== -1) {
    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.add("hidden");
    document.getElementById("step3").classList.remove("hidden");
  }
</script>
</body>
</html>
